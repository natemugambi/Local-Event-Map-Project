<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — The Spot</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <link rel="stylesheet" href="auth.css?v=2" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <meta name="theme-color" content="#0d0d0d" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">The <span>Spot</span></span>
    </div>

    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to manage your events.</p>

      <p class="auth-redirect-msg" id="redirect-msg"></p>

      <form class="auth-form" id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Your username" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Your password" />

        <button type="submit" class="auth-btn" id="login-btn">Log In</button>
        <p class="auth-message" id="auth-message"></p>
      </form>
    </div>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    <p class="auth-switch" style="margin-top:8px;"><a href="index.html">← Back to Map</a></p>
  </div>

  <script src="sanitize.js?v=3"></script>
  <script src="auth.js?v=3"></script>
  <script src="register-sw.js"></script>
</body>
</html>
