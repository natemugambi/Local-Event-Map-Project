<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — The Spot</title>
  <link rel="stylesheet" href="style.css?v=8" />
  <link rel="stylesheet" href="auth.css?v=3" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <meta name="theme-color" content="#0d0d0d" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">The <span>Spot</span></span>
    </div>

    <!-- Step 1: ask for the email (shown when there's no ?token= in the URL) -->
    <div class="auth-card" id="forgot-card">
      <h2>Forgot your password?</h2>
      <p class="auth-subtitle">Enter the email you signed up with and we'll send you a reset link.</p>
      <form class="auth-form" id="forgot-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />

        <button type="submit" class="auth-btn" id="forgot-btn">Send Reset Link</button>
        <p class="auth-message" id="auth-message"></p>
      </form>
    </div>

    <!-- Step 2: choose a new password (shown when opened from the emailed link) -->
    <div class="auth-card" id="reset-card" hidden>
      <h2>Choose a new password</h2>
      <p class="auth-subtitle">You'll be logged out everywhere and can log in with the new password.</p>
      <form class="auth-form" id="reset-form">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters" />

        <button type="submit" class="auth-btn" id="reset-btn">Save New Password</button>
        <p class="auth-message" id="reset-message"></p>
      </form>
    </div>

    <p class="auth-switch"><a href="login.html">Back to Log In</a></p>
  </div>

  <script src="sanitize.js?v=5"></script>
  <script src="auth.js?v=4"></script>
  <script src="register-sw.js"></script>
</body>
</html>
