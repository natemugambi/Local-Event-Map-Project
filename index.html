<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Spot — Bay Area Events Map</title>
  <meta name="description" content="Find hip-hop, R&amp;B, Afrobeats, comedy and community events across the Bay Area on one map. Updated every 30 minutes." />
  <!-- Link previews when the site is shared (iMessage, Instagram, X, Facebook, Slack...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Spot" />
  <meta property="og:title" content="The Spot — Bay Area Events Map" />
  <meta property="og:description" content="Hip-hop, R&amp;B, Afrobeats, comedy and community events across the Bay Area, all on one map." />
  <meta property="og:url" content="https://findthespot.net/" />
  <meta property="og:image" content="https://findthespot.net/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css?v=12" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <meta name="theme-color" content="#0d0d0d" />
</head>
<body>

  <!-- NAVBAR -->
  <nav id="navbar">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">The <span>Spot</span></span>
      <span class="tagline">Bay Area Events</span>
    </div>
    <div class="nav-right">
      <a href="https://www.instagram.com/blackbayeventsz/" target="_blank" rel="noopener noreferrer" class="ig-link" aria-label="Follow us on Instagram">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <circle cx="12" cy="12" r="4.2" />
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <div id="nav-auth">
        <!-- Filled in by script.js based on login state -->
      </div>
    </div>
  </nav>

  <!-- MAIN LAYOUT -->
  <div id="app-body">

    <!-- LEFT: EVENT PANEL -->
    <aside id="event-panel">
      <div id="panel-header">
        <div class="panel-title">
          <h2>Events Near You</h2>
        </div>
        <div class="search-row">
          <input type="search" id="event-search" placeholder="Search artists, venues, cities…" aria-label="Search events" autocomplete="off" />
          <button id="saved-toggle" class="saved-toggle" aria-pressed="false" title="Show saved events" aria-label="Show saved events">♡</button>
        </div>
        <div id="when-bar">
          <button class="when-btn active" data-when="any">Any time</button>
          <button class="when-btn" data-when="today">Today</button>
          <button class="when-btn" data-when="weekend">This weekend</button>
          <button class="when-btn" data-when="week">Next 7 days</button>
        </div>
        <div id="filter-bar">
          <button class="filter-btn active" data-filter="All">All</button>
          <button class="filter-btn" data-filter="Hip-Hop & Rap">Hip-Hop</button>
          <button class="filter-btn" data-filter="R&B & Soul">R&B & Soul</button>
          <button class="filter-btn" data-filter="Festivals & Entertainment">Festivals</button>
          <button class="filter-btn" data-filter="Comedy & Arts">Comedy & Arts</button>
          <button class="filter-btn" data-filter="Community Gatherings">Community</button>
        </div>
        <div class="sort-row">
          <span id="list-summary" aria-live="polite"></span>
          <div class="sort-toggle" role="group" aria-label="Sort events">
            <button class="sort-btn active" data-sort="date">Soonest</button>
            <button class="sort-btn" data-sort="distance">Nearest</button>
          </div>
        </div>
      </div>
      <div id="event-list"></div>
      <div id="panel-footer"><a href="privacy.html">Privacy</a></div>
    </aside>

    <!-- RIGHT: MAP -->
    <div id="map"></div>

  </div>

  <script src="sanitize.js?v=5"></script>
  <script src="vendor/markerclusterer-2.5.3.min.js"></script>
  <script src="script.js?v=20"></script>

  <!-- Loads Google Maps API — replace key below with your new restricted key -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDl6zuRSeRDo8tQXC-iOZWBYBX-2BG_WyM&callback=initMap">
  </script>

  <script src="register-sw.js"></script>
</body>
</html>
