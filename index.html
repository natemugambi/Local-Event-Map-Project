<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Spot</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <meta name="theme-color" content="#0d0d0d" />
</head>
<body>

  <!-- NAVBAR -->
  <nav id="navbar">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">The <span>Spot</span></span>
    </div>
    <div class="nav-right">
      <a href="https://www.instagram.com/blackbayeventsz/" target="_blank" rel="noopener noreferrer" class="ig-link" aria-label="Follow us on Instagram">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <circle cx="12" cy="12" r="4.2" />
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <span class="tagline">Bay Area Events</span>
      <div id="nav-auth">
        <!-- Filled in by script.js based on login state -->
      </div>
    </div>
  </nav>

  <!-- MAIN LAYOUT -->
  <div id="app-body">

    <!-- LEFT: EVENT PANEL -->
    <aside id="event-panel">
      <div id="panel-header">
        <h2>Events Near You</h2>
        <div id="filter-bar">
          <button class="filter-btn active" data-filter="All">All</button>
          <button class="filter-btn" data-filter="Hip-Hop & Rap">Hip-Hop</button>
          <button class="filter-btn" data-filter="R&B & Soul">R&B & Soul</button>
          <button class="filter-btn" data-filter="Festivals & Entertainment">Festivals</button>
          <button class="filter-btn" data-filter="Comedy & Arts">Comedy & Arts</button>
          <button class="filter-btn" data-filter="Community Gatherings">Community</button>
        </div>
      </div>
      <div id="event-list"></div>
    </aside>

    <!-- RIGHT: MAP -->
    <div id="map"></div>

  </div>

  <script src="sanitize.js?v=2"></script>
  <script src="script.js?v=8"></script>

  <!-- Loads Google Maps API — replace key below with your new restricted key -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDl6zuRSeRDo8tQXC-iOZWBYBX-2BG_WyM&callback=initMap">
  </script>

  <script src="register-sw.js"></script>
</body>
</html>
